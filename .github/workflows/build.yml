name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# a newer push to the same PR/branch supersedes the in-flight build; master
# builds are never cancelled so every commit keeps a full status
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # proves the library builds and tests green in an environment WITHOUT
  # LibreOffice: the soffice-gated ITs must skip cleanly, not fail
  verify-no-soffice:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test
        run: mvn -B verify

  # exercises the Windows-specific paths (process-tree kill grace, handle-release
  # delete retries, native stderr charset); soffice-gated tests skip here
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test
        run: mvn -B verify

  libreoffice-it:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-calc
      # fail loudly if soffice is missing, otherwise the gated tests skip silently
      - name: Assert soffice is available
        run: soffice --version
      - name: Build and run tests including LibreOffice conversion
        run: mvn -B verify
